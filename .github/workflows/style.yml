name: Style

on:
  pull_request:
    branches:
      - dev
  merge_group:
    types:
      - checks_requested

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install linters
        run: uv sync --locked --only-group lint

      # pyflakes checks for faulty or suspicious logic (unused or undefined
      # names, etc.).  The whole code base must be free of these errors.
      - name: Run pyflakes check on all files
        run: uv run --no-sync flake8 --select F,NQA

      # pycodestyle checks formatting.  Only lines modified in the pull
      # request are checked.
      - name: Run code style check on lines modified in pull request
        shell: bash
        run: |
          set -o pipefail
          git diff -U0 HEAD^ HEAD -- '*.py' | \
              uv run --no-sync pycodestyle --diff --max-line-length=119 --ignore=W503 | \
              perl -ne '
                print; if (/^([^:]+):(\d+):(\d+):/) {
                  $path = $1; $line = $2; $col = $3;
                  open F, $path or die;
                  print "\n";
                  while (<F>) {
                    next if $. < $line - 2;
                    print " $_";
                    if ($. == $line) { print " " x $col . "^\n\n"; last; }
                  }
                  close F;
                  $status = 1;
                }
                END { exit $status }'
