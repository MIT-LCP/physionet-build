{% if news.project %}
<p class="news-meta">News from: <a href="{% url 'published_project' news.project.slug news.project.version %}">{{ news.project }}.</a></p>
{% endif %}
<p class="news-meta">{{ news.publish_datetime|date }}</p>
<div class="news-content">
  {{ news.content|safe }}
</div>
{% if news.url %}
<p class="news-read-more">Read more: <a href="{{ news.url }}">{{ news.url }}</a></p>
{% endif %}
