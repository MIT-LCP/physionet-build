<div class="card mb-3" id="submission-date-filters"><div class="card-body">
    <form method="get" action="#submission-contributors" class="mb-3">
      {{ form.non_field_errors }}
      <div class="form-row align-items-end">
        <div class="form-group col-sm-4"><label for="{{ form.start_date.id_for_label }}">Start date</label>{{ form.start_date }}{{ form.start_date.errors }}</div>
        <div class="form-group col-sm-4"><label for="{{ form.end_date.id_for_label }}">End date</label>{{ form.end_date }}{{ form.end_date.errors }}</div>
        <div class="form-group col-sm-4"><button class="btn btn-primary" type="submit">Apply filters</button></div>
      </div>
    </form>
<p class="small text-muted mb-0">Dates filter the contributor charts. Activity charts use the 18-month and 6-year windows in their titles.</p>
</div></div>
