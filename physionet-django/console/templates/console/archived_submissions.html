{% extends "console/base_console.html" %}

{% load static %}

{% block title %}Archived Projects{% endblock %}

{% block local_css %}
<link rel="stylesheet" type="text/css" href="{% static 'custom/css/pagination.css' %}">
{% endblock %}

{% block content %}
<script src="{% static 'custom/js/cookie.js' %}"></script>
<script src="{% static 'console/js/search-console.js' %}"></script>

<div class="card mb-3">
  <div class="card-header">
    Archived Projects <span class="badge badge-pill badge-info">{{ projects.paginator.count }}</span>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <form method="get">
        <input
          id="archived-project-search"
          type="search"
          data-search-url="{% url 'project_search' bucket='archived' %}"
          oninput="searchArchived(this.dataset.searchUrl);"
          placeholder="Search..."
        >
        <div class="form-check mt-2 mb-3">
          <input
            class="form-check-input"
            id="has-assigned-editor"
            name="has_assigned_editor"
            type="checkbox"
            value="true"
            {% if has_assigned_editor %}checked{% endif %}
            onchange="this.form.submit();"
          >
          <label class="form-check-label" for="has-assigned-editor">
            Has an assigned editor
          </label>
        </div>
        {% include "console/archived_submissions_list.html" %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
