{% load static %}

<div class="modern-ui nav-wrapper">
  <nav class="nav">
    <div class="container my-0 h-100 d-flex justify-content-between align-items-center">
      <a href="/"><img src="{% static 'images/logo.png' %}" alt="PhysioNet Logo" /></a>
      <div class="nav__links align-items-center">
        <a href="/content"><button type="button" class="nav-link">Discover Data</button></a>
        <a href="/about/publish"><button type="button" class="nav-link">Share Data</button></a>
        <a href="/about"><button type="button" class="nav-link">About</button></a>
        <a href="/news"><button type="button" class="nav-link">News</button></a>
        <button type="button" class="nav-link nav-link--expandable">
          Explore <i class="bi bi-chevron-down ml-2"></i>
          <div class="nav-link__expand">
            <a class="nav-sublink" href="/about/database">
              <div class="nav-sublink__icon">
                <img src="{% static 'images/icons/data.png' %}" />
              </div>
              <div class="nav-sublink__text">
                <span class="nav-sublink__title">Data</span>
                <span class="nav-sublink__description">This page displays an alphabetical list of all the databases.</span>
              </div>
            </a>
            <a class="nav-sublink" href="/about/software">
              <div class="nav-sublink__icon">
                <img src="{% static 'images/icons/software.png' %}" />
              </div>
              <div class="nav-sublink__text">
                <span class="nav-sublink__title">Software</span>
                <span class="nav-sublink__description">This page displays an alphabetical list of all software projects.</span>
              </div>
            </a>
            <a class="nav-sublink" href="/about/challenge">
              <div class="nav-sublink__icon">
                <img src="{% static 'images/icons/challenges.png' %}" />
              </div>
              <div class="nav-sublink__text">
                <span class="nav-sublink__title">Challenges</span>
                <span class="nav-sublink__description">PhysioNet supports open challenges, which invite participants can tackle.</span>
              </div>
            </a>
            <a class="nav-sublink" href="/about/tutorial">
              <div class="nav-sublink__icon">
                <img src="{% static 'images/icons/tutorials.png' %}" />
              </div>
              <div class="nav-sublink__text">
                <span class="nav-sublink__title">Tutorials</span>
                <span class="nav-sublink__description">PhysioNet tutorials are intended to provide hands-on introductions to the data and software available.</span>
              </div>
            </a>
          </div>
        </button>
      </div>
      <div class="nav__actions d-flex ml-4">
        <form action="{% url 'content_index' %}" class="mr-2">
          <div class="nav__search">
            <input type="text" name="topic" placeholder="Search for anything...">
            <div class="nav__search__actions">
              <button type="button" class="nav__search__close mr-2"><i class="bi bi-x"></i></button>
              <button type="submit" class="circle-button">Search</button>
            </div>
          </div>
        </form>
        <button type="button" class="nav__search__open circle-button mr-2"><i class="bi bi-search"></i></button>
        {% if user.is_authenticated %}
          <button type="button" class="nav-link nav-link--expandable nav-link--expand-left nav-link--gray">
            {% if user.has_access_to_admin_console %}
              <i class="bi bi-person-fill-lock mr-2"></i>
            {% else %}
              <i class="bi bi-person-fill mr-2"></i>
            {% endif %}
            <span>{{ user }}</span>
            <i class="bi bi-chevron-down ml-2"></i>
            <div class="nav-link__expand">
              {% if user.is_authenticated and perms.events.view_event_menu %}
                <a class="nav-sublink" href="{% url 'event_home' %}">
                  <div class="nav-sublink__icon">
                    <img src="{% static 'images/icons/events.png' %}" />
                  </div>
                  <div class="nav-sublink__text">
                    <span class="nav-sublink__title">Events</span>
                    <span class="nav-sublink__description">Upcoming workshops and conferences in medical informatics.</span>
                  </div>
                </a>
              {% endif %}
              {% if user.is_authenticated %}
                {% if ENABLE_CLOUD_RESEARCH_ENVIRONMENTS %}
                  <a class="nav-sublink" href="{% url 'research_environments' %}">
                    <div class="nav-sublink__icon">
                      <img src="{% static 'images/icons/environments.png' %}" />
                    </div>
                    <div class="nav-sublink__text">
                      <span class="nav-sublink__title">Research Environments</span>
                      <span class="nav-sublink__description">Collaborative spaces for impactful healthcare research.</span>
                    </div>
                  </a>
                {% endif %}

                <a class="nav-sublink" href="{% url 'project_home' %}">
                  <div class="nav-sublink__icon">
                    <img src="{% static 'images/icons/projects.png' %}" />
                  </div>
                  <div class="nav-sublink__text">
                    <span class="nav-sublink__title">Projects</span>
                    <span class="nav-sublink__description">Innovative projects using medical datasets to advance healthcare.</span>
                  </div>
                </a>
              {% endif %}
              <a class="nav-sublink" href="{% url 'user_settings' %}">
                <div class="nav-sublink__icon">
                  <img src="{% static 'images/icons/settings.png' %}" />
                </div>
                <div class="nav-sublink__text">
                  <span class="nav-sublink__title">Settings</span>
                  <span class="nav-sublink__description">Customize your preferences and account configurations.</span>
                </div>
              </a>
              {% if user.has_access_to_admin_console %}
                <a class="nav-sublink" href="{% url 'console_home' %}">
                  <div class="nav-sublink__icon">
                    <img src="{% static 'images/icons/admin.png' %}" />
                  </div>
                  <div class="nav-sublink__text">
                    <span class="nav-sublink__title">Admin Console</span>
                    <span class="nav-sublink__description">Access the administrative tools to manage users and settings.</span>
                  </div>
                </a>
              {% endif %}
              <a class="nav-sublink" href="{% url 'logout' %}">
                <div class="nav-sublink__icon">
                  <img src="{% static 'images/icons/logout.png' %}" />
                </div>
                <div class="nav-sublink__text">
                  <span class="nav-sublink__title">Logout</span>
                  <span class="nav-sublink__description">Exit your account securely and return to the homepage.</span>
                </div>
              </a>
            </div>
          </button>
        {% else %}
          <a href="{% url 'login' %}">
            <button type="button" class="circle-button">
              <i class="bi bi-person"></i>
            </button>
          </a>
        {% endif %}
      </div>
    </div>
  </nav>
</div>

<!-- move this to the right place -->
<script>
const dom = {
  nav: document.querySelector('.nav'),
  expandableLinks: document.querySelectorAll('.nav-link--expandable'),
  searchOpenButton: document.querySelector('.nav__search__open'),
  searchCloseButton: document.querySelector('.nav__search__close')
};
let searchOpen = false;

dom.expandableLinks.forEach((link) => {
  link.addEventListener('click', (ev) => {
    ev.stopPropagation();
    ev.target.classList.toggle('nav-link--expanded');
  });
});

// clickaway
document.addEventListener('click', (ev) => {
  dom.expandableLinks.forEach((link) => {
    link.classList.remove('nav-link--expanded');
  });
});

dom.searchOpenButton.addEventListener('click', () => {
  dom.nav.classList.add('nav--search');
});
dom.searchCloseButton.addEventListener('click', () => {
  dom.nav.classList.remove('nav--search');
});
</script>
